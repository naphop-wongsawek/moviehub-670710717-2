# รันเทสต์อัตโนมัติทุกครั้งที่ push หรือเปิด pull request
name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test -- --watchAll=false

      - run: npm run build
        env:
          CI: true